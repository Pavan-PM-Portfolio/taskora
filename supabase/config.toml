# Taskora — Supabase CLI config.
# Used by `supabase link`, `supabase db push` and `supabase functions deploy`
# (all driven by scripts/deploy.sh). Auth settings below apply to local
# development only; set the same values in the hosted dashboard.
project_id = "taskora"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5500"
additional_redirect_urls = ["http://127.0.0.1:5500/", "http://localhost:5500/"]
# Short tokens bound how long a deactivated person keeps a session they
# already had. The admin-users function bans the account immediately.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Nobody signs themselves up. Accounts come from Members or the dashboard.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[functions.admin-users]
# The function verifies the caller's token itself (auth.getUser), which works
# with both legacy JWT secrets and the newer asymmetric signing keys.
verify_jwt = false
